<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión Bibliotecaria</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="layout-container">
        <header>
            <h1>Biblioteca</h1>
            <nav>
                <button onclick="mostrarVista('catalogo')" class="btn-nav active" id="btn-catalogo">Catálogo</button>
                <button onclick="mostrarVista('gestion')" class="btn-nav" id="btn-gestion">Gestión préstamos</button>
            </nav>
        </header>

        <div id="vista-catalogo">
            <section>
                <h2>Buscar Libros</h2>
                <div class="form-group" style="display:flex; gap:10px;">
                    <input type="text" id="busqueda-libro" placeholder="Título o Autor..." onkeyup="buscarLibro()">
                </div>
                <div id="resultados-catalogo">
                    </div>
            </section>
        </div>

        <div id="vista-gestion" style="display:none;">
            <section>
                <h2>Nuevo préstamo</h2>
                <div class="form-group">
                    <label>ID Usuario</label>
                    <input type="number" id="input-usuario" placeholder="Ej: 1, 2 o 3">
                </div>
                
                <div class="form-group">
                    <label>ID Libro</label>
                    <input type="number" id="input-libro" placeholder="Ej: 101, 102...">
                </div>
                
                <button onclick="registrarPrestamo()" class="btn">Confirmar préstamo</button>
            </section>

            <section>
                <h2>Préstamos activos</h2>
                <div id="lista-prestamos">
                    </div>
            </section>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
